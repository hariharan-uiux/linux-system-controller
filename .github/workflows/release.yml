name: Build & Release Linux Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Package Linux Controller
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build standalone tarball
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p release
          chmod +x run.sh
          tar --exclude='__pycache__' --exclude='*.pyc' --exclude='.venv' --exclude='.git' \
            -czvf "release/linux-system-controller-${VERSION}-linux-x64.tar.gz" \
            *.py run.sh requirements.txt voice_agent_widget.html components scripts README.md

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-controller-package
          path: release/*.tar.gz
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-controller-package
          path: artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
